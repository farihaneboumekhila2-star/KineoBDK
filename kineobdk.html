<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kineo BDK - Landing</title>
  
  <!-- Font Inter avec antialiasing élevé -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Script Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              blue: '#0066FF',
              dark: '#0F172A',
              teal: '#00A8B5',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
  </style>
</head>
<body class="flex min-h-full items-center justify-center p-4 sm:p-8">

  <main class="relative w-full max-w-4xl overflow-hidden rounded-[2.5rem] bg-gradient-to-b from-[#EEF6FF] via-[#F8FAFC] to-[#E3F0FF] p-8 sm:p-14 md:p-20 text-center shadow-2xl shadow-blue-900/5 border border-white/60">
    
    <!-- Halos décoratifs floutés (Haute Définition) -->
    <div class="absolute -bottom-24 -left-20 w-80 h-80 rounded-full bg-sky-200/50 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-28 -right-16 w-96 h-96 rounded-full bg-blue-200/60 blur-3xl pointer-events-none"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-white/40 blur-2xl pointer-events-none"></div>

    <div class="relative z-10 max-w-2xl mx-auto">
      
      <!-- En-tête / Logo vectoriel précis -->
      <div class="inline-flex items-center justify-center gap-3 mb-8">
        <svg class="w-8 h-8 text-brand-blue" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 28C16 28 3 20 3 11C3 7 6 4 10 4C13 4 15 6 16 8C17 6 19 4 22 4C26 4 29 7 29 11C29 20 16 28 16 28Z" fill="currentColor"/>
          <path d="M7 12H11L13 8L17 16L19 12H25" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="text-3xl font-black tracking-tight text-brand-dark">
          Kineo <span class="text-brand-blue">BDK</span>
        </span>
      </div>

      <!-- Titre principal avec dégradé subtil -->
      <h1 class="text-4xl sm:text-5xl font-extrabold text-brand-dark leading-[1.15] tracking-tight mb-6">
        Réalisez vos bilans kinésithérapiques <span class="text-brand-blue">plus</span>
        <span class="block text-brand-teal mt-1">rapidement</span>
      </h1>

      <!-- Descriptif -->
      <p class="text-slate-600 text-base sm:text-lg leading-relaxed mb-10 max-w-xl mx-auto font-normal">
        Analysez, structurez et maîtrisez le raisonnement clinique à l'aide de fiches intuitives, de tests validés scientifiquement et de recommandations de bonnes pratiques.
      </p>

      <!-- Bouton d'action principal -->
      <a href="#" class="inline-flex items-center gap-3 bg-brand-blue hover:bg-blue-700 text-white font-semibold text-lg px-8 py-4 rounded-full shadow-lg shadow-blue-600/30 hover:shadow-xl hover:shadow-blue-600/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
        <span>Commencer le BDK</span>
        <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
        </svg>
      </a>

    </div>
  </main>

</body>
</html>
